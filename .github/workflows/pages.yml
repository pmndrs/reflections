name: Build the site and deploy to GitHub Pages

# One Pages site: the docs (pmndrs/docs, the MDX in docs/site/) at /, the TypeDoc API at /api/ and the
# built examples at /examples/. It is served at https://pmndrs.github.io/reflections/, like the
# siblings (bvh, pathtracer, denoiser, upscaler). The `site` step reads the address from the Pages
# settings, so a custom domain set there later gives an empty base path with no change here.
# Pushes and pull requests only build it, to catch MDX and build errors. Deploying is manual
# (Actions > this workflow > Run workflow) until Dennis decides to publish.
# tools/site-build.ts is the build both here and locally (`pnpm docs:api && pnpm site:build`).
#
# The denoiser is the `denoiser` package from npm (a devDependency), installed with the rest; site-check
# fails a showcase that runs without it.
# The example models load from raw.githubusercontent.com at runtime (Khronos glTF Sample Assets, pinned in tools/site-build.ts).

on:
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      - 'src/**'
      - 'packages/**'
      - 'examples/**'
      - 'scripts/fetch-assets.mjs'
      - 'typedoc.json'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'packages/**'
      - 'examples/**'
      - 'scripts/fetch-assets.mjs'
      - 'typedoc.json'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# A pull request's ref is `refs/pull/<n>/merge`, so its runs never cancel a main deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags for the version label in the sidebar, but blobless.
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every code block of the docs is a type-checked sample in docs/site/snippets.
      - run: pnpm docs:check
      - run: pnpm docs:api
      # The address Pages serves the site at, and its path: https://pmndrs.github.io/reflections/ gives
      # BASE_PATH /reflections; a custom domain gives an empty one. An empty BASE_PATH on github.io
      # loads every script from pmndrs.github.io/_next/ (404) and the site renders blank.
      - id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)
          url=${url:-https://pmndrs.github.io/reflections/}
          url=${url%/}
          path=$(echo "$url" | sed -E 's#^https?://[^/]+##')
          echo "Site: $url (base path '${path}')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - run: pnpm site:build _site
        env:
          BASE_PATH: ${{ steps.site.outputs.path }}
          NEXT_PUBLIC_URL: ${{ steps.site.outputs.url }}
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/${{ github.event.pull_request.head.sha || github.sha }}/docs/site
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/${{ github.event.pull_request.head.sha || github.sha }}
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/${{ github.head_ref || 'main' }}/docs/site
          CONTRIBUTORS_PAT: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # Grant GITHUB_TOKEN the permissions a Pages deployment needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
