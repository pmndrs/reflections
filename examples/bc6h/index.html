<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>BC6H encoder</title>
    <style>
      :root { color-scheme: dark; --dn-border: #333; }
      body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 14px/1.45 system-ui, sans-serif; }
      .dn-page { max-width: 1020px; }
      .dn-status { font-size: .8rem; white-space: pre-wrap; color: #9a9; }
      canvas { width: 100%; max-width: 960px; image-rendering: pixelated; background: #000; border: 1px solid var(--dn-border); border-radius: 8px; display: block; }
      .labels { max-width: 960px; display: grid; grid-template-columns: repeat(3, 1fr); font-size: .8rem; color: #aaa; text-align: center; margin: .3rem 0; }
      #controls { max-width: 960px; display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; font-size: .85rem; margin: .6rem 0; }
      #controls label { display: inline-flex; align-items: center; gap: .35rem; }
      table { border-collapse: collapse; font-size: .8rem; margin: .6rem 0; }
      td, th { border: 1px solid var(--dn-border); padding: .2rem .5rem; text-align: right; }
      th { color: #aaa; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="dn-page">
      <h1>BC6H GPU encoder</h1>
      <p>
        A procedural HDR cube (gradients, a sun at ~1000, a near-black floor at 0.001, hard edges), encoded to
        <code>bc6h-rgb-ufloat</code> in compute and read back through the hardware decoder.
      </p>
      <div class="labels"><span>source (rgba16float)</span><span>BC6H (hardware decode)</span><span>|log2 error| × gain</span></div>
      <canvas id="view" width="768" height="256"></canvas>
      <div id="controls"></div>
      <div id="tables"></div>
      <pre id="status" class="dn-status">starting...</pre>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
