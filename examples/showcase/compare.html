<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Reflections compare</title>
    <style>
      :root { color-scheme: dark; --panel: #0d0f13f0; --line: #ffffff1a; --fg: #e6e6e6; --muted: #9aa0a8; --accent: #7aa7ff; }
      html, body { margin: 0; height: 100%; background: #08090b; color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      :root { --a: #4f8cff; --b: #ff9a3c; }
      #wrap { position: fixed; left: 0; top: 0; right: 316px; bottom: 0; display: flex; flex-direction: column; }
      #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
      /* the A | B bar: A's picker over the left half, B's over the right */
      #abbar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 8px 12px 4px; }
      .pick { display: flex; align-items: center; gap: 8px; min-width: 0; }
      #pickB { justify-content: flex-end; }
      .pick select { min-width: 0; max-width: 100%; flex: 0 1 300px; font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; background: #14171c; color: var(--fg); border: 2px solid; }
      #pickA select { border-color: var(--a); } #pickB select { border-color: var(--b); }
      .badge { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 700; color: #000; }
      .badge.a { background: var(--a); } .badge.b { background: var(--b); }
      #swapBtn { background: #1b1e24; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
      #presets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 2px 12px 6px; font-size: 12px; color: var(--muted); align-items: center; }
      #presets button { background: #14171c; color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 12px; }
      #presets button.on { border-color: var(--accent); background: #1d2533; }
      #stage { position: relative; max-width: 100%; max-height: 100%; background: #000; user-select: none; }
      #stage .layer { position: absolute; inset: 0; }
      #stage .layer canvas { width: 100%; height: 100%; display: block; }
      #input { position: absolute; inset: 0; touch-action: none; cursor: grab; }
      #divider { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 3px #000; }
      #handle { position: absolute; top: 50%; left: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #fff; color: #000;
        display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: ew-resize; box-shadow: 0 1px 4px #000a; }
      .label { position: absolute; top: 8px; padding: 4px 9px; border-radius: 6px; background: #000c; pointer-events: none; max-width: 46%; }
      .label .head { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
      .label .stat { font-size: 11px; color: #c9ced6; margin-top: 2px; white-space: pre-wrap; }
      #labelA { left: 8px; border-left: 3px solid var(--a); } #labelB { right: 8px; border-right: 3px solid var(--b); }
      #labelB .head { flex-direction: row-reverse; } #labelB .stat { text-align: right; }
      .label .badge { width: 20px; height: 20px; font-size: 12px; }
      #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 316px; box-sizing: border-box; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px; }
      #panel h1 { font-size: 14px; margin: 0 0 2px; }
      #panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
      #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
      #panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
      #panel label.check { justify-content: flex-start; }
      #panel select { width: 190px; }
      #panel input[type=number] { width: 64px; }
      #panel button { background: #1b1e24; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
      #panel button:disabled { opacity: .5; cursor: default; }
      #readout { font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c8d0c8; white-space: pre; overflow-x: auto; margin-top: 6px; }
      #status { font-size: 11px; color: var(--muted); white-space: pre-wrap; margin-top: 8px; }
      .note { color: var(--muted); font-size: 11px; margin: 4px 0; }
      a { color: var(--accent); }
      @media (max-width: 720px) { #wrap { right: 0; bottom: 45vh; } #panel { top: auto; height: 45vh; width: auto; left: 0; border-left: 0; border-top: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="abbar">
        <div class="pick" id="pickA"><span class="badge a">A</span></div>
        <button id="swapBtn" title="Swap A and B">&#x21C4; swap</button>
        <div class="pick" id="pickB"></div>
      </div>
      <div id="presets"><span>Quick pairs:</span></div>
      <div id="view">
        <div id="stage">
          <div class="layer" id="layerA"></div>
          <div class="layer" id="layerB"></div>
          <div id="input"></div>
          <div id="divider"><div id="handle">&#x2194;</div></div>
          <div class="label" id="labelA"><div class="head"><span class="badge a">A</span><span class="name"></span></div><div class="stat"></div></div>
          <div class="label" id="labelB"><div class="head"><span class="badge b">B</span><span class="name"></span></div><div class="stat"></div></div>
        </div>
      </div>
    </div>
    <div id="panel">
      <h1>Reflections: compare</h1>
      <div class="sub">A (left of the divider) against B (right), same scene and camera. Pick each side in the bar above the image. Each method has its own renderer and its own copy of the scene. <a href="./">showcase</a></div>
      <div id="controls"></div>
      <pre id="status">starting...</pre>
    </div>
    <script type="module" src="./src/compare.ts"></script>
  </body>
</html>
