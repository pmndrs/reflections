<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Reflections tuning bench</title>
    <style>
      :root { color-scheme: dark; --panel: #0d0f13f0; --line: #ffffff1a; --fg: #e6e6e6; --muted: #9aa0a8; --accent: #7aa7ff; --a: #4f8cff; --b: #ff9a3c; --mod: #ffd166; }
      html, body { margin: 0; height: 100%; background: #08090b; color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #wrap { position: fixed; left: 0; top: 0; right: 380px; bottom: 0; display: flex; flex-direction: column; }
      #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px 8px; }
      #abbar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 8px 12px 4px; }
      .pick { display: flex; align-items: center; gap: 8px; min-width: 0; }
      #pickB { justify-content: flex-end; }
      .pick select { min-width: 0; max-width: 100%; flex: 0 1 300px; font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 6px; background: #14171c; color: var(--fg); border: 2px solid; }
      #pickA select { border-color: var(--a); } #pickB select { border-color: var(--b); }
      .badge { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; font-weight: 700; color: #000; font-size: 12px; }
      .badge.a { background: var(--a); } .badge.b { background: var(--b); }
      button, select, input { font: inherit; }
      button { background: #1b1e24; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      button.on { border-color: var(--accent); background: #1d2533; }
      button.warn { border-color: var(--mod); color: var(--mod); }
      #toolbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 2px 12px 6px; font-size: 12px; color: var(--muted); }
      #toolbar .seg { display: inline-flex; }
      #toolbar .seg button { border-radius: 0; margin-left: -1px; }
      #toolbar .seg button:first-child { border-radius: 6px 0 0 6px; } #toolbar .seg button:last-child { border-radius: 0 6px 6px 0; }
      #toolbar input[type=range] { width: 90px; }
      #stage { position: relative; max-width: 100%; max-height: 100%; background: #000; user-select: none; }
      #stage .layer { position: absolute; top: 0; bottom: 0; }
      #stage .layer canvas, #diff { width: 100%; height: 100%; display: block; }
      #diffLayer { position: absolute; inset: 0; display: none; }
      #input { position: absolute; inset: 0; touch-action: none; cursor: grab; }
      #overlay { position: absolute; inset: 0; pointer-events: none; }
      #overlay.drawing { pointer-events: auto; cursor: crosshair; }
      #divider { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 3px #000; }
      #handle { position: absolute; top: 50%; left: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #fff; color: #000;
        display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: ew-resize; box-shadow: 0 1px 4px #000a; }
      .label { position: absolute; top: 8px; padding: 4px 9px; border-radius: 6px; background: #000c; pointer-events: none; max-width: 46%; }
      .label .head { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
      .label .stat { font-size: 11px; color: #c9ced6; margin-top: 2px; white-space: pre-wrap; }
      #labelA { left: 8px; border-left: 3px solid var(--a); } #labelB { right: 8px; border-right: 3px solid var(--b); }
      #labelB .head { flex-direction: row-reverse; } #labelB .stat { text-align: right; }
      #legend { position: absolute; left: 8px; bottom: 8px; padding: 5px 8px; border-radius: 6px; background: #000c; font-size: 11px; display: none; pointer-events: none; }
      #legend .bar { width: 220px; height: 10px; border-radius: 2px; margin: 3px 0; }
      #legend .ticks { display: flex; justify-content: space-between; color: #c9ced6; }
      #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; box-sizing: border-box; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px 40px; }
      #panel h1 { font-size: 14px; margin: 0 0 2px; }
      #panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
      #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
      #panel details { border-top: 1px solid var(--line); padding: 4px 0; }
      #panel details > summary { cursor: pointer; font-size: 12px; font-weight: 600; padding: 3px 0; list-style: none; display: flex; justify-content: space-between; }
      #panel details > summary::-webkit-details-marker { display: none; }
      #panel details > summary .count { color: var(--mod); font-weight: 500; font-size: 11px; }
      #panel details.aa { border: 1px solid var(--accent); border-radius: 8px; padding: 4px 8px; margin-bottom: 6px; background: #121826; }
      .blurb { color: var(--muted); font-size: 11px; margin: 0 0 4px; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: center; padding: 3px 0; border-bottom: 1px dashed #ffffff0d; }
      .row.mod .name { color: var(--mod); }
      .row.planned { opacity: .5; }
      .row .name { font-size: 12px; display: flex; gap: 5px; align-items: baseline; flex-wrap: wrap; }
      .row .tags { font-size: 10px; color: var(--muted); }
      .row .tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-right: 3px; }
      .row .tag.rb { border-color: #c79bff66; color: #c79bff; }
      .row .ctl { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
      .row .ctl input[type=range] { width: 110px; }
      .row .ctl input[type=number] { width: 62px; }
      .row .ctl select { max-width: 150px; background: #14171c; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
      .row .def { grid-column: 1 / -1; font-size: 10px; color: var(--muted); }
      .row .reset { padding: 0 6px; font-size: 12px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
      #filter { width: 100%; box-sizing: border-box; background: #14171c; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
      pre.mono, #readout, #timings, #code { font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c8d0c8; white-space: pre; overflow-x: auto; margin: 4px 0; }
      #code { max-height: 260px; background: #0a0c0f; border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: none; }
      #status { font-size: 11px; color: var(--muted); white-space: pre-wrap; margin-top: 8px; }
      #regionList { font-size: 11px; }
      #regionList div { display: flex; justify-content: space-between; gap: 6px; }
      .note { color: var(--muted); font-size: 11px; margin: 4px 0; }
      label.inline { display: flex; align-items: center; gap: 6px; justify-content: space-between; margin: 3px 0; }
      label.inline input[type=number] { width: 64px; }
      a { color: var(--accent); }
      @media (max-width: 760px) { #wrap { right: 0; bottom: 50vh; } #panel { top: auto; height: 50vh; width: auto; left: 0; border-left: 0; border-top: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="abbar">
        <div class="pick" id="pickA"><span class="badge a">A</span></div>
        <button id="swapBtn" title="Swap A and B">&#x21C4; swap</button>
        <div class="pick" id="pickB"></div>
      </div>
      <div id="toolbar"></div>
      <div id="view">
        <div id="stage">
          <div class="layer" id="layerA"></div>
          <div class="layer" id="layerB"></div>
          <div id="diffLayer"><canvas id="diff"></canvas></div>
          <div id="input"></div>
          <div id="divider"><div id="handle">&#x2194;</div></div>
          <svg id="overlay"></svg>
          <div class="label" id="labelA"><div class="head"><span class="badge a">A</span><span class="name"></span></div><div class="stat"></div></div>
          <div class="label" id="labelB"><div class="head"><span class="badge b">B</span><span class="name"></span></div><div class="stat"></div></div>
          <div id="legend"><div class="title"></div><div class="bar"></div><div class="ticks"></div></div>
        </div>
      </div>
    </div>
    <div id="panel">
      <h1>Reflections: tuning bench</h1>
      <div class="sub">Every setting, two methods side by side, the difference, and Measure vs the path tracer. Settings change every method they apply to; the URL holds the view. <a href="./">showcase</a> · <a href="./compare.html">compare</a> · <a href="https://github.com/pmndrs/reflections/blob/main/docs/SETTINGS.md">settings guide</a></div>
      <div id="controls"></div>
      <pre id="status">starting...</pre>
    </div>
    <script type="module" src="./src/bench.ts"></script>
  </body>
</html>
