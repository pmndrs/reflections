<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Reflections showcase</title>
    <style>
      :root { color-scheme: dark; --panel: #0d0f13e6; --line: #ffffff1a; --fg: #e6e6e6; --muted: #9aa0a8; --accent: #7aa7ff; }
      html, body { margin: 0; height: 100%; background: #08090b; color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      body.fixed canvas#view { inset: auto; left: 0; top: 0; width: auto; height: auto; max-width: 100vw; max-height: 100vh; }
      #panel { position: fixed; top: 12px; right: 12px; width: 280px; max-height: calc(100vh - 24px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
      #panel h1 { font-size: 14px; margin: 0 0 2px; }
      #panel .sub { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
      #panel h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
      #panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
      #panel label.check { justify-content: flex-start; }
      #panel select, #panel input[type=range] { width: 150px; }
      #panel .seg { display: flex; gap: 0; margin: 4px 0; }
      #panel .seg button { flex: 1; background: #1b1e24; color: var(--fg); border: 1px solid var(--line); padding: 5px 0; cursor: pointer; font: inherit; }
      #panel .seg button:first-child { border-radius: 6px 0 0 6px; }
      #panel .seg button:last-child { border-radius: 0 6px 6px 0; }
      #panel .seg button.on { background: var(--accent); color: #08090b; font-weight: 600; }
      #panel .val { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
      #panel .legend { display: grid; grid-template-columns: 12px 1fr; gap: 2px 6px; font-size: 11px; color: var(--muted); margin-top: 4px; }
      #panel .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-top: 2px; }
      #timings { font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #b8c4b8; white-space: pre; }
      #status { position: fixed; left: 12px; bottom: 10px; right: 310px; font-size: 11px; color: var(--muted); white-space: pre-wrap; text-shadow: 0 1px 2px #000; pointer-events: none; }
      a { color: var(--accent); }
      @media (max-width: 640px) { #panel { width: auto; left: 12px; max-height: 45vh; } #status { right: 12px; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <h1>@pmndrs/reflections</h1>
      <div class="sub">Probes + screen-space + ray-traced fallback, composed per pixel. <a href="../">all examples</a></div>
      <div id="controls"></div>
    </div>
    <pre id="status">starting...</pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
