<!doctype html>

    <title>Quick start: probes only</title>
    <style>
      :root { color-scheme: dark; }

      .page { max-width: 1020px; }
      code { background: #0006; padding: 0 .3em; border-radius: 4px; }

  <body>
    <div class="page">
      <h1>Quick start: probes only</h1>

        The cheapest path: one baked reflection probe and <code>renderer.render()</code> as usual, no extra passes. Code:
        <a href="https://github.com/pmndrs/reflections/blob/main/examples/quickstart/src/probes.ts">src/probes.ts</a>.
        With screen-space reflections too: <a href="./">index.html</a>.
      </p>
      <canvas id="view" width="960" height="540"></canvas>
      <pre id="status">starting...</pre>
    </div>
    <script type="module" src="./src/probes.ts"></script>
