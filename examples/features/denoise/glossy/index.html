<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/shell/favicon.svg" />
    <title>Denoising glossy reflections · @pmndrs/reflections</title>
    <style>
      :root { color-scheme: dark; --panel: #0d0f13e6; --line: #ffffff1a; --fg: #e6e6e6; --muted: #9aa0a8; --accent: #7aa7ff; }
      html, body { margin: 0; height: 100%; background: #08090b; color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #panel { position: fixed; top: 12px; right: 12px; width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
      #panel label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
      #panel label.check { justify-content: flex-start; }
      #panel .compare { color: var(--accent); }
      #meter { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font: 11px/1.5 ui-monospace, monospace; white-space: pre; color: var(--muted); }
      #meter b { color: var(--fg); font-weight: 600; }
      #status { position: fixed; left: 12px; bottom: 10px; right: 260px; font-size: 11px; color: var(--muted); white-space: pre-wrap; text-shadow: 0 1px 2px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <label class="check compare"><input type="checkbox" id="denoiseOff" /> Denoiser off</label>
      <label>View <select id="cameraView"><option value="default">Spheres</option><option value="strips">Floor strips</option></select></label>
      <div id="meter">flicker meter: starting...</div>
    </div>
    <pre id="status">starting...</pre>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
